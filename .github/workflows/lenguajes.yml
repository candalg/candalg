Qué tienes que cambiar
Entra en tu repositorio y abre .github/workflows/lenguajes.yml.

Sustituye su contenido por el nuevo lenguajes.yml y guarda los cambios.

Actualiza también el README para quitar el título duplicado.

Ve a Actions → Actualizar lenguajes del perfil → Run workflow.

La tarjeta tendrá fondo #1B1B1B, borde gris claro, textos blancos y grises, y la misma distribución de barra y porcentajes que tu captura.

No tienes que tocar el token LANGUAGES_STATS_TOKEN, ni hacer públicos tus repositorios privados. El workflow seguirá utilizando el acceso que ya configuraste.

Cuando termine la ejecución, actualiza tu perfil. Si sigue apareciendo el diseño anterior, espera unos minutos por la caché de imágenes de GitHub.




name: Actualizar lenguajes del perfil

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lenguajes:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar tarjeta de lenguajes
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=candalg&layout=compact&langs_count=8&locale=es&theme=dark&bg_color=1B1B1B&title_color=FFFFFF&text_color=A3A3A3&border_color=BDBDBD&hide_border=false&border_radius=7&card_width=440'
          path: profile/top-langs.svg
          token: ${{ secrets.LANGUAGES_STATS_TOKEN }}
          fail_on_error: true

      - name: Guardar tarjeta actualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/top-langs.svg
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estadísticas de lenguajes"
            git push
          fi

